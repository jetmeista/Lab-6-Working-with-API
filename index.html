<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Pokédex</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>My Pokédex</h1>
    <p class="intro">Search for a Pokémon to see its information!</p>

    <form id="searchForm">
      <input type="text" id="pokemonInput" placeholder="Try pikachu or 25" aria-label="Pokémon name or number" required>
      <button type="submit">Search</button>
    </form>

    <p id="message" role="status">Enter a Pokémon name or Pokédex number above.</p>

    <section id="pokemonCard" hidden>
      <p id="pokemonNumber"></p>
      <img id="pokemonImage" alt="Pokémon artwork">
      <h2 id="pokemonName"></h2>
      <p id="pokemonTypes"></p>
      <div class="details">
        <p><strong>Height:</strong> <span id="pokemonHeight"></span></p>
        <p><strong>Weight:</strong> <span id="pokemonWeight"></span></p>
        <p><strong>HP:</strong> <span id="pokemonHP"></span></p>
        <p><strong>Attack:</strong> <span id="pokemonAttack"></span></p>
        <p><strong>Defense:</strong> <span id="pokemonDefense"></span></p>
      </div>
    </section>

    <footer>Data provided by <a href="https://pokeapi.co/" target="_blank" rel="noopener noreferrer">PokéAPI</a></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
